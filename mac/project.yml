# XcodeGen 项目定义：CodeWhisper 原生 macOS 菜单栏应用
name: CodeWhisper
options:
  bundleIdPrefix: com.codewhisper
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    PRODUCT_NAME: CodeWhisper
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.18.0"
targets:
  CodeWhisper:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        type: folder
        buildPhase: resources
    dependencies:
      - package: WhisperKit
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: CodeWhisper
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "MIT License"
        NSMicrophoneUsageDescription: "CodeWhisper 需要访问麦克风以录制语音并在本地完成转录。"
        NSAppleEventsUsageDescription: "CodeWhisper 需要发送按键以将转录结果自动粘贴到当前应用。"
    entitlements:
      path: Sources/CodeWhisper.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codewhisper.app
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
